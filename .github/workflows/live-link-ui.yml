name: Add shared live-link UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-landing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if '/live-link.js' not in s:
              s=s.replace('</body>','<script src="/live-link.js"></script></body>',1)
              p.write_text(s)
          PY
      - name: Commit landing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add temporary shared live-link UI"
          git push