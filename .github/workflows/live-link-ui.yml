name: Add shared live-link UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='id="liveLinkWidget"'
          if marker in s:
              print('Live UI already present')
              raise SystemExit(0)
          css='''
.live-widget{position:fixed;right:22px;bottom:22px;z-index:90;width:min(390px,calc(100vw - 28px));border:1px solid #303030;border-radius:18px;background:rgba(12,12,12,.94);backdrop-filter:blur(18px);box-shadow:0 24px 70px #000b,inset 0 1px #444;padding:14px}.live-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.live-title{font:700 11px 'DM Mono',monospace;letter-spacing:.12em;color:#aeb79b;text-transform:uppercase}.live-dot{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block;margin-right:7px}.live-dot.on{background:var(--accent);box-shadow:0 0 12px var(--accent)}.live-form{display:flex;gap:8px}.live-input{min-width:0;flex:1;border:1px solid #303030;border-radius:11px;background:#090909;color:#eee;padding:11px 12px;outline:none;font:12px Inter,Arial,sans-serif}.live-input:focus{border-color:#59621f}.live-save{border:1px solid #536025;border-radius:11px;background:#151a0c;color:#eaffbd;padding:0 15px;font-weight:700;cursor:pointer}.live-save:hover{background:#1c250e}.live-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:#686868;font:10px 'DM Mono',monospace}.live-status{color:#777}.live-status.ok{color:#a7c66a}.live-open{display:none;margin-top:10px;border:1px solid #303030;border-radius:11px;padding:9px 11px;color:#ddd;background:#101010;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.live-open.show{display:block}.live-link-banner{position:fixed;left:50%;top:88px;transform:translateX(-50%) translateY(-10px);z-index:95;width:min(760px,calc(100vw - 28px));padding:11px 14px;border:1px solid #39421d;border-radius:14px;background:rgba(17,20,11,.96);box-shadow:0 18px 55px #000a;color:#d9ff8d;display:none;align-items:center;gap:10px}.live-link-banner.show{display:flex;animation:liveIn .22s ease}.live-link-banner a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font:11px 'DM Mono',monospace}.live-dismiss{border:0;background:none;color:#777;cursor:pointer;font-size:18px}@keyframes liveIn{to{transform:translateX(-50%) translateY(0)}}
@media(max-width:520px){.live-widget{right:14px;bottom:14px}.live-form{display:grid;grid-template-columns:1fr auto}.live-input{width:100%}}
'''
          html='''
<div class="live-widget" id="liveLinkWidget" aria-label="Temporary shared link">
  <div class="live-top"><div class="live-title"><span class="live-dot" id="liveDot"></span>Temporary live link</div><span class="live-status" id="liveStatus">Share for 3 minutes</span></div>
  <div class="live-form"><input class="live-input" id="liveInput" type="url" inputmode="url" autocomplete="off" placeholder="Paste a link to share…"><button class="live-save" id="liveSave" type="button">Save</button></div>
  <div class="live-meta"><span id="liveExpiry">Nothing shared</span><span>auto-expires</span></div>
  <a class="live-open" id="liveOpen" target="_blank" rel="noopener noreferrer"></a>
</div>
<div class="live-link-banner" id="liveBanner"><span class="live-dot on"></span><a id="liveBannerLink" target="_blank" rel="noopener noreferrer"></a><button class="live-dismiss" id="liveDismiss" type="button">×</button></div>
'''
          js='''
<script>
(()=>{
const input=document.getElementById('liveInput'),save=document.getElementById('liveSave'),status=document.getElementById('liveStatus'),expiry=document.getElementById('liveExpiry'),open=document.getElementById('liveOpen'),dot=document.getElementById('liveDot'),banner=document.getElementById('liveBanner'),bannerLink=document.getElementById('liveBannerLink'),dismiss=document.getElementById('liveDismiss');
if(!input||!save)return;
let timer=null;
const fmt=s=>s<=0?'expired':`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function show(item){if(!item?.active){dot.classList.remove('on');status.textContent='Share for 3 minutes';status.classList.remove('ok');expiry.textContent='Nothing shared';open.classList.remove('show');return}dot.classList.add('on');status.textContent='LIVE';status.classList.add('ok');open.href=item.url;open.textContent=item.url;open.classList.add('show');const tick=()=>{const left=Math.max(0,Math.ceil((item.expiresAt-Date.now())/1000));expiry.textContent=left?`Expires in ${fmt(left)}`:'Expired';if(!left){clearInterval(timer);show(null)}};clearInterval(timer);tick();timer=setInterval(tick,1000)}
async function sync(showBanner=true){try{const r=await fetch('/api/live',{cache:'no-store'});const item=await r.json();if(item.active&&showBanner){bannerLink.href=item.url;bannerLink.textContent=`Live link · ${item.url}`;banner.classList.add('show')}show(item)}catch{status.textContent='Live link unavailable'}}
save.onclick=async()=>{const url=input.value.trim();if(!url){input.focus();return}save.disabled=true;save.textContent='Saving…';try{const r=await fetch('/api/live',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to save');input.value='';show(data);bannerLink.href=data.url;bannerLink.textContent=`Live link · ${data.url}`;banner.classList.add('show');setTimeout(()=>banner.classList.remove('show'),7000)}catch(e){status.textContent=e.message||'Could not save link';status.classList.remove('ok')}finally{save.disabled=false;save.textContent='Save'}};
dismiss.onclick=()=>banner.classList.remove('show');
input.addEventListener('keydown',e=>{if(e.key==='Enter')save.click()});
sync(true);
})();
</script>
'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('<footer>',html+'<footer>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit landing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add temporary shared live-link UI"
          git push
