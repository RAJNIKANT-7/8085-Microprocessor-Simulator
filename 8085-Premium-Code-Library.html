<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>8085 Premium Code Library</title>
<style>
:root{--bg:#070b10;--panel:#0d141d;--panel2:#111c27;--line:#263747;--text:#edf5fb;--muted:#8ea2b5;--accent:#72d6ff;--accent2:#a78bfa;--ok:#69e7a4;--mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#132536 0,#070b10 42%,#05070a 100%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:28px 16px 48px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.eyebrow{font:700 11px var(--mono);letter-spacing:2px;color:var(--accent);text-transform:uppercase}.hero h1{margin:5px 0 4px;font-size:30px}.hero p{margin:0;color:var(--muted)}.badge{border:1px solid #35516a;background:#0b1824;border-radius:999px;padding:8px 12px;color:#bfeaff;font:700 11px var(--mono)}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.select{flex:1;min-width:260px;background:linear-gradient(180deg,#132331,#0b141d);border:1px solid #385269;border-radius:14px;color:var(--text);padding:14px 16px;font-size:15px;outline:none;box-shadow:0 12px 30px #0007}.card{background:linear-gradient(145deg,#101923,#091017);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px #0008}.cardHead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}.title{font-weight:800;font-size:18px}.desc{color:var(--muted);font-size:13px;margin-top:4px}.pill{font:700 11px var(--mono);color:var(--ok);border:1px solid #245d49;background:#0b2119;border-radius:999px;padding:7px 10px;white-space:nowrap}.tableWrap{overflow:auto}.codeTable{width:100%;border-collapse:collapse;font:13px var(--mono)}th,td{padding:10px 14px;border-bottom:1px solid #1c2b39;text-align:left}th{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;background:#0a1118}td:first-child{color:#9dc6df;width:120px}td:last-child{color:#e7f5ff;font-weight:700}.copyArea{padding:16px 20px 20px}.copyBox{display:flex;gap:10px;align-items:stretch}.bytes{flex:1;background:#050a0f;border:1px solid #2c4152;border-radius:12px;padding:14px;color:#bfeaff;font:700 14px/1.7 var(--mono);word-break:break-word;min-height:48px}.copyBtn{border:1px solid #4b7f9a;border-radius:12px;background:linear-gradient(180deg,#17374a,#0e2432);color:#eaf9ff;font-weight:800;padding:0 18px;cursor:pointer;transition:.18s}.copyBtn:hover{transform:translateY(-1px);filter:brightness(1.15)}.copyBtn:active{transform:translateY(1px)}.hint{margin-top:9px;color:#73899b;font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.mini{padding:13px 14px;background:#0a1118;border:1px solid #1e2e3c;border-radius:12px;color:#b5c6d4;cursor:pointer;text-align:left}.mini strong{display:block;color:#eef7ff}.mini span{font-size:11px}.mini.active{border-color:#477995;background:#0d1b26;box-shadow:inset 0 0 0 1px #25495d}@media(max-width:700px){.hero{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div><div class="eyebrow">8085 · PROGRAM VAULT</div><h1>Premium Code Library</h1><p>Verified byte-oriented programs with address → opcode mapping.</p></div><div class="badge">COPY-READY HEX</div></div>
<div class="bar"><select id="picker" class="select"></select></div>
<div id="app"></div>
<div id="cards" class="grid"></div>
</div>
<script>
const programs=[
{name:'Addition',desc:'5H + 3H → 08H stored at 3000H.',bytes:'3E 05 06 03 80 32 00 30 76',rows:[['2000','3E','MVI A,05H'],['2002','06','MVI B,03H'],['2004','80','ADD B'],['2005','32 00 30','STA 3000H'],['2008','76','HLT']]},
{name:'Subtraction',desc:'9H − 4H → 05H stored at 3000H.',bytes:'3E 09 06 04 90 32 00 30 76',rows:[['2000','3E','MVI A,09H'],['2002','06','MVI B,04H'],['2004','90','SUB B'],['2005','32 00 30','STA 3000H'],['2008','76','HLT']]},
{name:'Multiplication',desc:'7 × 6 using repeated addition → 2AH.',bytes:'3E 00 06 07 0E 06 80 0D C2 06 20 32 00 30 76',rows:[['2000','3E 00','MVI A,00H'],['2002','06 07','MVI B,07H'],['2004','0E 06','MVI C,06H'],['2006','80','ADD B'],['2007','0D','DCR C'],['2008','C2 06 20','JNZ 2006H'],['200B','32 00 30','STA 3000H'],['200E','76','HLT']]},
{name:'Swap B ↔ C',desc:'Swaps B and C through the accumulator.',bytes:'06 12 0E 34 78 41 4F 76',rows:[['2000','06 12','MVI B,12H'],['2002','0E 34','MVI C,34H'],['2004','78','MOV A,B'],['2005','41','MOV B,C'],['2006','4F','MOV C,A'],['2007','76','HLT']]},
{name:'Fibonacci (10)',desc:'Stores 10 Fibonacci terms from 3000H.',bytes:'21 00 30 06 00 0E 01 16 0A 78 77 23 79 41 4F 15 C2 09 20 76',rows:[['2000','21 00 30','LXI H,3000H'],['2003','06 00','MVI B,00H'],['2005','0E 01','MVI C,01H'],['2007','16 0A','MVI D,0AH'],['2009','78 77','MOV A,B / MOV M,A'],['200B','23','INX H'],['200C','79 41 4F','MOV A,C / MOV B,C / MOV C,A'],['200F','15','DCR D'],['2010','C2 09 20','JNZ 2009H'],['2013','76','HLT']]},
{name:'Largest (3 values)',desc:'Compares 12H, 34H, 2AH and leaves 34H as the largest.',bytes:'3A 00 30 06 02 47 3A 01 30 B8 DA 14 20 78 47 3A 02 30 B8 DA 14 20 32 00 30 76',rows:[['2000','3A 00 30','LDA 3000H'],['2003','06 02','MVI B,02H'],['2005','47','MOV B,A'],['2006','3A 01 30','LDA 3001H'],['2009','B8','CMP B'],['200A','DA 14 20','JC 2014H'],['200D','78 47','MOV A,B / MOV B,A'],['200F','3A 02 30','LDA 3002H'],['2012','B8','CMP B'],['2013','DA 14 20','JC 2014H'],['2016','32 00 30','STA 3000H'],['2019','76','HLT']]},
{name:'Array Sum (2 bytes)',desc:'Adds bytes at 3000H and 3001H → 07H.',bytes:'21 00 30 06 01 0E 02 3E 00 86 23 0D C2 09 20 32 00 30 76',rows:[['2000','21 00 30','LXI H,3000H'],['2003','06 01','MVI B,01H'],['2005','0E 02','MVI C,02H'],['2007','3E 00','MVI A,00H'],['2009','86','ADD M'],['200A','23','INX H'],['200B','0D','DCR C'],['200C','C2 09 20','JNZ 2009H'],['200F','32 00 30','STA 3000H'],['2012','76','HLT']]},
{name:'Search Byte',desc:'Searches 22H in 3 bytes; FFH means not found, otherwise stores the low address byte at 3003H.',bytes:'0E 22 21 00 30 06 03 7E B9 CA 12 20 23 05 C2 08 20 3E FF 32 03 30 76 7D 32 03 30 76',rows:[['2000','0E 22','MVI C,22H'],['2002','21 00 30','LXI H,3000H'],['2005','06 03','MVI B,03H'],['2007','7E','MOV A,M'],['2008','B9','CMP C'],['2009','CA 12 20','JZ 2012H'],['200C','23 05','INX H / DCR B'],['200E','C2 08 20','JNZ 2008H'],['2011','3E FF','MVI A,FFH'],['2013','32 03 30','STA 3003H'],['2016','76','HLT']]},
{name:'Memory Load / Store',desc:'Writes 55H to 3000H, reads it back and mirrors it to 3001H.',bytes:'3E 55 32 00 30 3A 00 30 32 01 30 76',rows:[['2000','3E 55','MVI A,55H'],['2002','32 00 30','STA 3000H'],['2005','3A 00 30','LDA 3000H'],['2008','32 01 30','STA 3001H'],['200B','76','HLT']]},
{name:'Register Pair Increment',desc:'Loads HL=3000H, increments it, then stores the pair at 3000H.',bytes:'21 00 30 23 22 00 30 76',rows:[['2000','21 00 30','LXI H,3000H'],['2003','23','INX H'],['2004','22 00 30','SHLD 3000H'],['2007','76','HLT']]}
];
const picker=document.getElementById('picker'),cards=document.getElementById('cards'),app=document.getElementById('app');
programs.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.name;picker.appendChild(o);const b=document.createElement('button');b.className='mini';b.innerHTML='<strong>'+p.name+'</strong><span>'+p.desc+'</span>';b.onclick=()=>{picker.value=i;render(i)};cards.appendChild(b)});
function render(i){const p=programs[i];document.querySelectorAll('.mini').forEach((b,j)=>b.classList.toggle('active',j===i));app.innerHTML='<div class="card"><div class="cardHead"><div><div class="title">'+p.name+'</div><div class="desc">'+p.desc+'</div></div><div class="pill">READY · 8085</div></div><div class="tableWrap"><table class="codeTable"><thead><tr><th>Address</th><th>Code</th><th>Instruction</th></tr></thead><tbody>'+p.rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')+'</tbody></table></div><div class="copyArea"><div class="copyBox"><div id="bytes" class="bytes">'+p.bytes+'</div><button class="copyBtn" onclick="copyBytes()">COPY HEX</button></div><div class="hint">Paste this byte stream directly into the simulator's program/code input. Bytes are space-separated exactly as requested.</div></div></div>'}
async function copyBytes(){const t=document.getElementById('bytes').textContent;try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}const b=document.querySelector('.copyBtn');b.textContent='COPIED ✓';setTimeout(()=>b.textContent='COPY HEX',1100)}
picker.onchange=()=>render(+picker.value);render(0);
</script></body></html>
